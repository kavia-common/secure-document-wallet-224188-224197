name: flutter_frontend
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.2
  path: ^1.9.0
  flutter_dotenv: ^5.1.0
  provider: ^6.1.1
  flutter_staggered_grid_view: ^0.7.0
  shared_preferences: ^2.2.2
